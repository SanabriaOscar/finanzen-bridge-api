finnazen:
  bridge:
    host: 127.0.0.1
    port: 9095
    ws-path: /ws
    pairing-token: ${BRIDGE_PAIRING_TOKEN:finnazen-bridge-local-dev}
    open-browser-on-start: true
    scale:
      # true + mock-weight-kg para pruebas sin báscula física; true + port-name para COM real (fase serial)
      enabled: false
      port-name: COM3
      mock-weight-kg: 0
      poll-interval-ms: 500
    printer:
      enabled: true
      # Xprinter XP-58IIT — térmica 58 mm, ESC/POS, USB
      name: ${BRIDGE_PRINTER_NAME:XP-58}
      paper-width-mm: 50

server:
  port: ${finnazen.bridge.port}
  address: ${finnazen.bridge.host}

spring:
  application:
    name: finnazen-bridge

logging:
  level:
    com.finnazen.bridge: INFO
